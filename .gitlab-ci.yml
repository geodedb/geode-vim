stages:
  - validate
  - test

variables:
  GIT_DEPTH: 1

# Validate Vimscript syntax
validate-vimscript:
  stage: validate
  image: alpine:latest
  before_script:
    - apk add --no-cache vim
  script:
    - |
      echo "Validating Vimscript files..."
      for file in $(find . -name "*.vim" -type f); do
        echo "Checking $file..."
        # Check for basic Vimscript syntax errors using vim
        vim -es -u NONE -c "source $file" -c "quit" 2>&1 || {
          echo "Syntax error in $file"
          exit 1
        }
      done
      echo "All Vimscript files are valid!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Validate plugin structure
validate-structure:
  stage: validate
  image: alpine:latest
  script:
    - |
      echo "Validating plugin structure..."

      # Required directories
      test -d "syntax" || { echo "Missing syntax directory"; exit 1; }
      test -d "ftdetect" || { echo "Missing ftdetect directory"; exit 1; }

      # Required files
      test -f "syntax/gql.vim" || { echo "Missing syntax/gql.vim"; exit 1; }
      test -f "ftdetect/gql.vim" || { echo "Missing ftdetect/gql.vim"; exit 1; }

      echo "Plugin structure is valid!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Test syntax highlighting loads in Vim
test-vim-loading:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache vim
  script:
    - |
      echo "Testing Vim plugin loading..."

      # Create a test GQL file
      echo "MATCH (n:Person) RETURN n.name" > /tmp/test.gql

      # Test that the plugin loads without errors
      vim -es -u NONE \
        -c "set runtimepath+=$(pwd)" \
        -c "runtime ftdetect/gql.vim" \
        -c "runtime syntax/gql.vim" \
        -c "edit /tmp/test.gql" \
        -c "if &filetype != 'gql' | cquit 1 | endif" \
        -c "if !exists('b:current_syntax') || b:current_syntax != 'gql' | cquit 2 | endif" \
        -c "quit" 2>&1

      echo "Vim plugin loads correctly!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Test syntax highlighting coverage
test-syntax-coverage:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache vim
  script:
    - |
      echo "Testing syntax highlighting coverage..."

      # Create a comprehensive test file
      cat > /tmp/test_coverage.gql << 'EOF'
      -- This is a comment
      // Another comment
      /* Multi-line
         comment */

      MATCH (p:Person {name: 'Alice', age: 30})
      WHERE p.age > 25 AND p.city IN ['NYC', 'LA']
      RETURN p.name, count(*) AS total
      ORDER BY total DESC
      LIMIT 10

      CREATE (n:Node {id: $param, vector: VectorF32([0.1, 0.2])})
      SET n.updated = timestamp()
      RETURN n

      MATCH (a)-[r:KNOWS]->(b)
      WHERE distance(a.embedding, b.embedding, 'L2') < 0.5
      RETURN a, r, b

      BEGIN TRANSACTION
      MERGE (x:Label)
      ON CREATE SET x.created = TRUE
      COMMIT
      EOF

      # Verify the file can be opened and syntax applied
      vim -es -u NONE \
        -c "set runtimepath+=$(pwd)" \
        -c "runtime ftdetect/gql.vim" \
        -c "runtime syntax/gql.vim" \
        -c "edit /tmp/test_coverage.gql" \
        -c "if &filetype != 'gql' | cquit 1 | endif" \
        -c "quit" 2>&1

      echo "Syntax highlighting coverage test passed!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
