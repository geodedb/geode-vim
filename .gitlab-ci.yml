include:
  # Security scanning
  # NOTE: Component versions pinned to immutable commit SHAs for supply chain security.
  # Verify versions in gitlab.com/devnw/ci-catalog and update as needed.
  - component: gitlab.com/devnw/ci-catalog/security-sast@1e0be8e792274924d1326f9c0e35a298e5fca1a5
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@1e0be8e792274924d1326f9c0e35a298e5fca1a5
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-secrets@1e0be8e792274924d1326f9c0e35a298e5fca1a5
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@1e0be8e792274924d1326f9c0e35a298e5fca1a5

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@1e0be8e792274924d1326f9c0e35a298e5fca1a5

  - component: gitlab.com/devnw/ci-catalog/sbom-scan@1e0be8e792274924d1326f9c0e35a298e5fca1a5

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@1e0be8e792274924d1326f9c0e35a298e5fca1a5
    inputs:
      stage: release

# Fork protection: Control pipeline execution for security
# - Always run on default branch and protected branches
# - Auto-run for MRs from same project (not forks)
# - Require manual trigger for MRs from forks
workflow:
  rules:
    # Run on default branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Run on protected branches
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    # Auto-run for MRs from same project (not a fork)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID
    # Manual trigger required for MRs from forks (security protection)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: manual
      allow_failure: false
    # Run on tags
    - if: $CI_COMMIT_TAG

default:
  tags:
    - company
    - linux

stages:
  - validate
  - test
  - security
  - sbom
  - release

variables:
  # Full history enables security scanners to detect historical secrets.
  GIT_DEPTH: 0

# Validate Vimscript syntax - check for basic vimscript errors
validate-vimscript:
  stage: validate
  image: alpine:3.19@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1
  before_script:
    - apk add --no-cache vim=9.0.2127-r0 grep=3.11-r0
  script:
    - |
      echo "Validating Vimscript files..."

      # Check for common vimscript errors
      # Using find -print0 | while read to safely handle filenames with special characters
      errors=0
      error_marker="$(mktemp)"
      trap 'rm -f "$error_marker"' EXIT

      # First pass: syntax checks
      find . -name "*.vim" -type f -print0 | while IFS= read -r -d '' file; do
        echo "Checking $file..."

        # Check for mismatched quotes
        if grep -nE "^[^\"]*'[^'\"]*$" "$file" 2>/dev/null | grep -v "\""; then
          echo "Warning: Possible unclosed single quote in $file"
        fi

        # Check for mismatched parens in obvious cases
        if grep -nE "^[^\"]*\([^)\"]*$" "$file" 2>/dev/null | head -5; then
          echo "Note: Line may have unclosed paren in $file (may be multi-line)"
        fi
      done

      # Second pass: verify files are non-empty
      find . -name "*.vim" -type f -print0 | while IFS= read -r -d '' file; do
        if [ ! -s "$file" ]; then
          echo "Error: $file is empty"
          # Write to temp file since subshell can't modify parent errors variable
          echo "1" > "$error_marker"
        fi
      done

      # Check if any errors were recorded
      if [ -s "$error_marker" ]; then
        errors=1
      fi

      if [ $errors -eq 1 ]; then
        exit 1
      fi
      echo "Vimscript validation complete!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Validate plugin structure
validate-structure:
  stage: validate
  image: alpine:3.19@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1
  script:
    - |
      echo "Validating plugin structure..."

      # Required directories
      test -d "syntax" || { echo "Missing syntax directory"; exit 1; }
      test -d "ftdetect" || { echo "Missing ftdetect directory"; exit 1; }

      # Required files
      test -f "syntax/gql.vim" || { echo "Missing syntax/gql.vim"; exit 1; }
      test -f "ftdetect/gql.vim" || { echo "Missing ftdetect/gql.vim"; exit 1; }
      test -f "language_metadata.zig" || { echo "Missing language_metadata.zig"; exit 1; }

      echo "Plugin structure is valid!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Validate security configuration baselines
validate-security-config:
  stage: validate
  image: alpine:3.19@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1
  before_script:
    - apk add --no-cache grep=3.11-r0
  script:
    - |
      set -e
      echo "Validating security configuration..."

      # Ensure gitleaks does not skip tests/testdata paths
      if grep -nE "tests/\\.|testdata" .gitleaks.toml; then
        echo "Error: gitleaks allowlist includes broad test paths"
        exit 1
      fi

      # Ensure gitleaks does not skip log files
      if grep -nE "^[^#]*\\.log\\$" .gitleaks.toml; then
        echo "Error: gitleaks allowlist includes *.log files"
        exit 1
      fi

      # Ensure apk installs are pinned to versions
      if ! grep -nE "apk add --no-cache vim=9\\.0\\.2127-r0 grep=3\\.11-r0" .gitlab-ci.yml >/dev/null; then
        echo "Error: vim/grep apk versions are not pinned"
        exit 1
      fi

      if [ "$(grep -cE "apk add --no-cache vim=9\\.0\\.2127-r0" .gitlab-ci.yml)" -lt 3 ]; then
        echo "Error: expected pinned vim installs in CI jobs"
        exit 1
      fi

      if [ "$(grep -cE "grep=3\\.11-r0" .gitlab-ci.yml)" -lt 2 ]; then
        echo "Error: expected pinned grep installs in CI jobs"
        exit 1
      fi

      echo "Security configuration validation complete!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Test syntax highlighting loads in Vim
test-vim-loading:
  stage: test
  image: alpine:3.19@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1
  before_script:
    - apk add --no-cache vim=9.0.2127-r0
  script:
    - |
      echo "Testing Vim plugin loading..."

      tmp_dir="$(mktemp -d)"
      trap 'rm -rf "$tmp_dir"' EXIT
      test_gql="$tmp_dir/test.gql"
      test_vim="$tmp_dir/test_load.vim"
      vim_output="$tmp_dir/vim_output.txt"

      # Create a test GQL file
      echo "MATCH (n:Person) RETURN n.name" > "$test_gql"

      # Create a test script that properly loads the plugin
      cat > "$test_vim" << 'VIMEOF'
      set nocompatible
      set runtimepath+=.
      filetype on
      syntax on
      runtime ftdetect/gql.vim
      edit PLACEHOLDER_TEST_FILE
      " Re-detect filetype after loading the file
      filetype detect
      " Now set syntax based on filetype
      if &filetype == 'gql'
        set syntax=gql
      endif
      if &filetype != 'gql'
        echom "FAIL: filetype is not gql, got: " . &filetype
        cquit! 1
      endif
      if !exists('b:current_syntax') || b:current_syntax != 'gql'
        echom "FAIL: syntax not loaded, b:current_syntax = " . (exists('b:current_syntax') ? b:current_syntax : 'undefined')
        cquit! 2
      endif
      echom "SUCCESS: plugin loaded correctly"
      qall!
      VIMEOF

      sed -i "s|PLACEHOLDER_TEST_FILE|$test_gql|g" "$test_vim"

      # Test that the plugin loads - capture exit code properly
      set +e
      vim -N -u NONE -S "$test_vim" > "$vim_output" 2>&1
      exit_code=$?
      set -e

      cat "$vim_output" || true

      if [ $exit_code -ne 0 ]; then
        echo "Vim plugin loading test failed with exit code $exit_code"
        exit 1
      fi

      echo "Vim plugin loads correctly!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Test syntax highlighting coverage
test-syntax-coverage:
  stage: test
  image: alpine:3.19@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1
  before_script:
    - apk add --no-cache vim=9.0.2127-r0
  script:
    - |
      echo "Testing syntax highlighting coverage..."

      tmp_dir="$(mktemp -d)"
      trap 'rm -rf "$tmp_dir"' EXIT
      test_gql="$tmp_dir/test_coverage.gql"
      test_vim="$tmp_dir/test_coverage.vim"
      vim_output="$tmp_dir/vim_output.txt"

      # Create a comprehensive test file
      cat > "$test_gql" << 'EOF'
      -- This is a comment
      // Another comment
      /* Multi-line
         comment */

      MATCH (p:Person {name: 'Alice', age: 30})
      WHERE p.age > 25 AND p.city IN ['NYC', 'LA']
      RETURN p.name, count(*) AS total
      ORDER BY total DESC
      LIMIT 10

      CREATE (n:Node {id: $param, vector: VectorF32([0.1, 0.2])})
      SET n.updated = timestamp()
      RETURN n

      MATCH (a)-[r:KNOWS]->(b)
      WHERE distance(a.embedding, b.embedding, 'L2') < 0.5
      RETURN a, r, b

      BEGIN TRANSACTION
      MERGE (x:Label)
      ON CREATE SET x.created = TRUE
      COMMIT
      EOF

      # Create a test script
      cat > "$test_vim" << 'VIMEOF'
      set nocompatible
      set runtimepath+=.
      runtime ftdetect/gql.vim
      runtime syntax/gql.vim
      edit PLACEHOLDER_TEST_FILE
      if &filetype != 'gql'
        echom "FAIL: filetype not set"
        cquit! 1
      endif
      echom "SUCCESS: coverage test passed"
      qall!
      VIMEOF

      sed -i "s|PLACEHOLDER_TEST_FILE|$test_gql|g" "$test_vim"

      # Verify the file can be opened and syntax applied
      set +e
      vim -N -u NONE -S "$test_vim" > "$vim_output" 2>&1
      exit_code=$?
      set -e

      cat "$vim_output" || true

      if [ $exit_code -ne 0 ]; then
        echo "Syntax coverage test failed with exit code $exit_code"
        exit 1
      fi

      echo "Syntax highlighting coverage test passed!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
