title = "Gitleaks Configuration"

[extend]
useDefault = true

# NOTE: No global allowlist. Newer gitleaks rejects an allowlist block
# with no checks ("[[allowlists]] must contain at least one check"), so
# add one only together with concrete regexes/paths.

# Example allowlist for known false positive patterns (placeholder keys in docs):
# [[rules.allowlist]]
# description = "Example placeholder API keys in documentation"
# regexes = ['''YOUR_API_KEY_HERE''', '''EXAMPLE_.*_KEY''', '''<your-.*-here>''']
# paths = ['''README\.md$''', '''docs/.*\.md$''']
