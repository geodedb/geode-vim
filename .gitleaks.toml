title = "Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
  '''testdata''',
  '''tests/.*''',
  '''.*\.log$''',
]
# NOTE: Removed broad exclusions for .vim and .md files to ensure secrets are detected.
# If false positives occur, use specific regex-based allowlist rules below instead.

