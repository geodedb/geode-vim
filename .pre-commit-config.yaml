# Pre-commit configuration for Geode Vim Plugin
# https://pre-commit.com/

default_stages: [pre-commit]
fail_fast: false

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b
  hooks:
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: check-yaml
  - id: check-json
  - id: detect-private-key
  - id: check-added-large-files
    args: [--maxkb=1024]
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: check-symlinks
  - id: destroyed-symlinks
  - id: check-executables-have-shebangs
  - id: check-shebang-scripts-are-executable

- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: a23f6b85d0fdd5bb9d564e2579e678033debbdff
  hooks:
  - id: shellcheck
    args: [--severity=error, --shell=bash]

- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: 0d9fcb51a54f3b750b911c054b4bd1a590f1b592
  hooks:
  - id: markdownlint
    args: [--fix, --disable, MD013, MD033, MD041, MD024, --]
    exclude: ^(CHANGELOG\.md)

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: a6273196190bb0f68caf1dc68073cf62c719f725
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
    exclude: ^(\.gitlab-ci\.yml)

- repo: https://github.com/commitizen-tools/commitizen
  rev: 27499d727f5ceff802bda34bbda314644824ce06
  hooks:
  - id: commitizen
    stages: [commit-msg]

- repo: local
  hooks:
  - id: check-todos
    name: check for TODOs/FIXMEs
    entry: bash
    args:
    - -c
    - |
      git diff --cached --name-only -z | xargs -0 grep -l -E "(TODO|FIXME|XXX|HACK)" -- 2>/dev/null && echo "Warning: Found TODO/FIXME markers in staged files" && exit 0 || exit 0
    language: system
    pass_filenames: false
    verbose: true

ci:
  autofix_prs: true
  autofix_commit_msg: '[pre-commit.ci] auto fixes'
  autoupdate_schedule: weekly
  submodules: false
